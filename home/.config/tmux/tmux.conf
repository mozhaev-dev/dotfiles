# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbering contiguous
set -g renumber-windows on

# Mouse support
set -g mouse on

# Mouse selection: copy to system clipboard, stay in copy mode
# (default copy-pipe-and-cancel exits copy mode, which drops the highlight and
# snaps the view back to the bottom of the scrollback)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

# Same for double-click (word) and triple-click (line). The 0.3s delay is from
# the tmux defaults: it lets a triple-click land before the double-click copies.
bind -n DoubleClick1Pane select-pane -t = \; \
  if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } \
    { copy-mode ; send -X select-word ; run -d0.3 ; send -X copy-pipe-no-clear "pbcopy" }
bind -n TripleClick1Pane select-pane -t = \; \
  if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } \
    { copy-mode ; send -X select-line ; run -d0.3 ; send -X copy-pipe-no-clear "pbcopy" }

bind -T copy-mode-vi DoubleClick1Pane select-pane \; \
  send -X select-word \; run -d0.3 \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    DoubleClick1Pane select-pane \; \
  send -X select-word \; run -d0.3 \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; \
  send -X select-line \; run -d0.3 \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    TripleClick1Pane select-pane \; \
  send -X select-line \; run -d0.3 \; send -X copy-pipe-no-clear "pbcopy"

# A plain click dismisses the selection. At the bottom of the buffer it also
# leaves copy mode; scrolled up it only drops the highlight, so the click does
# not throw the view back down.
bind -T copy-mode-vi MouseDown1Pane select-pane \; \
  if -F "#{==:#{scroll_position},0}" { send -X cancel } { send -X clear-selection }
bind -T copy-mode    MouseDown1Pane select-pane \; \
  if -F "#{==:#{scroll_position},0}" { send -X cancel } { send -X clear-selection }

# Ctrl+click opens the URL under the cursor (replaces the default swap-pane)
bind -n C-MouseDown1Pane \
  run -b "~/.config/tmux/open-mouse-url.sh X#{mouse_x} L#{q:mouse_line} H#{q:mouse_hyperlink}"
bind -T copy-mode-vi C-MouseDown1Pane \
  run -b "~/.config/tmux/open-mouse-url.sh X#{mouse_x} L#{q:mouse_line} H#{q:mouse_hyperlink}"

# More scrollback history
set -g history-limit 50000

# Better terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:hyperlinks"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[default] "
set -g status-right "#[fg=#f9e2af]#(~/.config/tmux/git-branch.sh #{q:pane_current_path})  #[fg=#6c7086]#H  #[fg=#cdd6f4]%d %b %H:%M "

# Make the active window unmistakable
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#313244,fg=#a6adc8] #I:#W #[default] "
setw -g window-status-current-format "#[bg=#a6e3a1,fg=#11111b,bold] #I:#W #[default] "
setw -g window-status-activity-style "bg=#f9e2af,fg=#11111b,bold"

# Pane borders follow the same palette
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Faster escape handling
set -sg escape-time 10

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----MACHINE-LOCAL----

source-file -q ~/.config/tmux/tmux.local.conf
